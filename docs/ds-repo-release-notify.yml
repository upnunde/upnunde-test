# Renovel-Studio-DS 저장소에 복사할 워크플로
# 경로: .github/workflows/notify-upnunde-test.yml
#
# 사전 설정 (DS repo Secrets):
#   UPNUNDE_TEST_DISPATCH_PAT — upnunde-test에 repository_dispatch 권한이 있는 PAT
#
# DS 태그 푸시(v*) 또는 GitHub Release publish 시 upnunde-test ds-sync 실행

name: Notify upnunde-test (DS release)

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger upnunde-test ds-sync
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UPNUNDE_TEST_DISPATCH_PAT }}
          repository: upnunde/upnunde-test
          event-type: ds-release
          client-payload: '{"tag":"${{ github.event.release.tag_name || github.ref_name }}"}'
